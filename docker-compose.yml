services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: signal_sms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - signal_sms_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/countries_seed.sql:/docker-entrypoint-initdb.d/02-countries.sql:ro
      - ./database/seeds/services_seed.sql:/docker-entrypoint-initdb.d/03-services.sql:ro
volumes:
  signal_sms_data:
