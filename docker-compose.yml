services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-signal_sms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - signal_sms_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/countries_seed.sql:/docker-entrypoint-initdb.d/02-countries.sql:ro
      - ./database/seeds/services_seed.sql:/docker-entrypoint-initdb.d/03-services.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-signal_sms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-signal_sms}
      PARTNER_URL: ${PARTNER_URL:-https://simdrop.me/}
      IP_HASH_SALT: ${IP_HASH_SALT:-local}
      REDIRECT_ALLOWED_ORIGINS: ${REDIRECT_ALLOWED_ORIGINS:-http://localhost:3000}
    ports: ["${API_PORT:-4000}:4000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
        NUXT_PUBLIC_GA_ID: ${NUXT_PUBLIC_GA_ID:-}
        NUXT_PUBLIC_YANDEX_METRIKA_ID: ${NUXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NUXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NUXT_PUBLIC_YANDEX_VERIFICATION: ${NUXT_PUBLIC_YANDEX_VERIFICATION:-}
    environment:
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
      NUXT_API_INTERNAL_URL: http://api:4000
      NUXT_PARTNER_URL: ${PARTNER_URL:-https://simdrop.me/}
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api}
      NUXT_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  signal_sms_data:
